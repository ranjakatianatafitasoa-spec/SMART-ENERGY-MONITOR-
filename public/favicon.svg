<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e3a53" />
      <stop offset="60%" stop-color="#051524" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded App Base -->
  <rect width="512" height="512" rx="116" fill="#020617" />
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#0891b2" stroke-width="2.5" opacity="0.4" />

  <!-- Outer Cyber Tech Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="14 10" opacity="0.5" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" />

  <!-- Corner Tech Accent Dots -->
  <circle cx="90" cy="90" r="5" fill="#22d3ee" opacity="0.7" />
  <circle cx="422" cy="90" r="5" fill="#22d3ee" opacity="0.7" />
  <circle cx="90" cy="422" r="5" fill="#22d3ee" opacity="0.7" />
  <circle cx="422" cy="422" r="5" fill="#22d3ee" opacity="0.7" />

  <!-- Cyber Hexagonal Shield Container -->
  <polygon points="256,65 425,162 425,350 256,447 87,350 87,162" 
           fill="#041829" stroke="url(#shieldGrad)" stroke-width="14" 
           stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Cyber Grid Accent -->
  <polygon points="256,98 392,176 392,336 256,414 120,336 120,176" 
           fill="#020d18" stroke="#0e7490" stroke-width="3" opacity="0.6" />

  <!-- Glowing Dynamic Electric Lightning Bolt -->
  <path d="M285 125 L155 268 L242 268 L218 395 L357 236 L270 236 Z" 
        fill="url(#boltGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
</svg>
