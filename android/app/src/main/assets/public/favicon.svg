<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="112" fill="#030712" />
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" opacity="0.9" />

  <!-- Outer Cyber Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" />

  <!-- Cyber Hexagonal Shield -->
  <polygon points="256,70 420,165 420,355 256,450 92,355 92,165" 
           fill="#041b2d" stroke="url(#shieldGrad)" stroke-width="12" 
           stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Circuit Grid Accent -->
  <polygon points="256,105 385,180 385,335 256,410 127,335 127,180" 
           fill="none" stroke="#0891b2" stroke-width="2" opacity="0.45" />

  <!-- Glowing Lightning Bolt & Energy Wave -->
  <path d="M280 130 L160 270 L245 270 L220 395 L355 240 L270 240 Z" 
        fill="url(#boltGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="4" />
</svg>
